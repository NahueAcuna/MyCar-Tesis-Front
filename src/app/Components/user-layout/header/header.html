<header>
    <span id="logo" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
        style="cursor: pointer;">MyCar</span>
    <nav>
        <ul>
            <li routerLink="/nuestros-autos" routerLinkActive="active" style="cursor: pointer;">Nuestros Autos</li>
            <li routerLink="/vender" routerLinkActive="active" style="cursor: pointer;">Vende tu Auto</li>
            <li routerLink="/marketplace" routerLinkActive="active" style="cursor: pointer;">MarketPlace</li>
            @if (authService.isAdmin()) {
                <li routerLink="/gestionar" routerLinkActive="active" style="cursor: pointer;">Gestionar</li>
            }
        </ul>
    </nav>

    <div id="buttons">
        <button class="login-btn" routerLink="/login">Log in</button>
        <button class="signup-btn" routerLink="/registro">Sign Up</button>
    </div>

</header>
