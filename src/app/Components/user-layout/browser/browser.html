<div id="total_container">
  <div id="content">
    <div>
      <p id="title">Encuentra tu <span>Auto</span> ideal</p>
      <p id="hero">Tu próximo auto está acá. ¿Nuestra agencia o el Marketplace? Vos elegís.</p>
    </div>
    <div id="boxes">
      <div class="box">
        <span>{{ expCount }}<span class="plus">+</span></span>
        <p>Años de experiencia</p>
      </div>
      <div class="box">
        <span>{{ clientesCount }}<span class="plus">+</span></span>
        <p>Clientes Satisfechos</p>
      </div>
      <a href="tel:+542235555555" id="call_btn">
        <div id="call_icon">
          <span class="material-symbols-outlined"> call </span>
        </div>
        <p>Llamanos!</p>
      </a>
    </div>
    
    <span class="material-symbols-outlined" id="arrow" (click)="scrollToInventory()" style="cursor: pointer"> keyboard_arrow_down </span>
    <a href="https://www.google.com/maps/search/Rivadavia+4065+Mar+del+Plata" target="_blank" rel="noopener noreferrer" id="location_icon">
      <span class="material-symbols-outlined"> location_on </span>
      <p>Mar del plata, Rivadavia 4065</p>
    </a>
  </div>
</div>
