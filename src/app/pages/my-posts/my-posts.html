<app-header></app-header>
<div class="post-page">

    <div class="overlay"></div>

    <div class="post-container">
        @for(post of myPosts; track post.id){
            
            <a class="car_publication" [routerLink]="['/publicacion', post.id]" target="_blank" style="text-decoration: none;">
                
                <img [src]="getImageUrl(post.auto.imagenesUrl[0])" alt="Imagen del auto" (error)="onImageError($event)">
                
                <div class="information">
                    
                    <div class="name_price">
                        <p>{{ post.auto.marca }} {{ post.auto.modelo }}</p>
                        <span>${{ post.auto.precio | number:'1.0-0' }}</span>
                    </div>
                    
                    <div class="info-footer">
                        <div class="anio_description">
                            <span>{{ post.auto.anio }} - {{ post.auto.km }} km</span><br>
                            <span>{{ descriptionPreview(post.descripcion) }}</span>
                        </div>
                        
                        <div class="status-badge" [ngClass]="post.estado">
                            {{ post.estado }}
                        </div>
                    </div>
                </div>

            </a>
        }
    </div>
</div>
