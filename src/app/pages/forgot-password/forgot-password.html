<div class="auth-container">
  <div class="auth-box">
    <h2>Recuperar Contraseña</h2>
    <p>Ingresá tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="ejemplo@correo.com">
    </div>

    <button class="btn-primary" (click)="enviarCorreo()" [disabled]="cargando">
      {{ cargando ? 'Enviando...' : 'Enviar enlace' }}
    </button>

    <p class="auth-links">
      ¿Te acordaste? <a routerLink="/login">Volver al inicio de sesión</a>
    </p>
  </div>
</div>
