<app-header></app-header>
<div class="post-page">

    <div class="overlay"></div>

    <div class="post-container">
        @for(favorite of myFavorites; track favorite.id){
            <div class="post-card" [routerLink]="['/publicacion', favorite.id]">
                
                <div class="post-img-container">
                    <img [src]="getImageUrl(favorite.auto.imagenesUrl[0])" alt="Imagen del auto">
                </div>

                <div class="post-info">
                    <!-- Agrupamos el título y el corazón -->
                    <div class="fav-header">
                        <h3>{{ favorite.auto.marca }} {{ favorite.auto.modelo }}</h3>
                        
                        <!-- Pasamos $event a la función -->
                        <button class="btn-remove-fav" (click)="quitarFavorito($event, favorite.id)" title="Quitar de favoritos">
                            <span class="material-symbols-outlined">favorite</span>
                        </button>
                    </div>
                                
                    <p class="year-km">
                        {{ favorite.auto.anio }} - {{ favorite.auto.km }} km
                    </p>

                    <p class="price">
                        ${{ favorite.auto.precio }}
                    </p>
                </div>
            </div>
        }
    </div>

    <button class="btnBack" (click)="goBack()">Volver</button>
</div>
