<div class="auth-container">
  <div class="auth-box">
    <h2>Crear Nueva Contraseña</h2>
    <p>Ingresá tu nueva contraseña para tu cuenta de MyCar.</p>

    <div class="form-group">
      <label>Nueva Contraseña</label>
      <input type="password" [(ngModel)]="nuevaPassword" placeholder="Mínimo 6 caracteres">
    </div>

    <div class="form-group">
      <label>Confirmar Contraseña</label>
      <input type="password" [(ngModel)]="confirmarPassword" placeholder="Repetí la contraseña">
    </div>

    <button class="btn-primary" (click)="cambiarPassword()">
      Guardar contraseña
    </button>
  </div>
</div>
